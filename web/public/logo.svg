<svg xmlns="http://www.w3.org/2000/svg" viewBox="71 66 400 400" role="img" aria-label="Priced Ug">
  <!--
    The price-tag glyph from the mobile app's icon (artifacts/pricedug/assets/store/icon.svg),
    with the white background plate removed so it sits transparently in the header.
    Brand red #E01E37 — the app's own colour. The old favicon.png used pure #FF0000,
    which clashed with everything else on the page.

    The viewBox is cropped to the glyph's post-rotation bounding box (measured in a
    browser, stroke included) so the tag fills its box instead of floating in the
    28% of empty padding the original 0 0 512 512 box left around it.
  -->
  <g transform="rotate(-45 256 256)">
    <path
      d="M150 250 L150 408 Q150 430 172 430 L348 430 Q370 430 370 408 L370 250 L260 140 Z"
      fill="#E01E37"
      stroke="#E01E37"
      stroke-width="22"
      stroke-linejoin="round"
    />
    <circle cx="260" cy="228" r="33" fill="#ffffff" />
    <path
      d="M260 150 C 262 104, 332 104, 330 156"
      fill="none"
      stroke="#E01E37"
      stroke-width="22"
      stroke-linecap="round"
    />
  </g>
</svg>
